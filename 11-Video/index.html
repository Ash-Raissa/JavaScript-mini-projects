<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>

    <!-- styles -->
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!-- preloader -->

    <div class="preloader">
        <img src="./preloader.gif" type="video/mp4" />
    </div>
    <!-- header -->
    <header>
        <video class="video-container" muted autoplay loop>
            <source src="./10042939-hd_1920_1080_24fps.mp4" type="video/mp4" />
        </video>

        <!-- video switch -->
        <button class="switch-btn">
            <span>
                play
            </span>
            <span>
                pause
            </span>
            <span class="switch">
            </span>
        </button>
    </header>

    <h1>video project</h1>


    <!-- javascript -->
    <script src="app.js"></script>
</body>

</html>
