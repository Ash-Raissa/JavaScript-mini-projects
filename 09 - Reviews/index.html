<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starter</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />

    <!-- styles -->
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <main>
        <section class="container">
            <!-- title -->

            <div class="title">
                <h2>Our reviews</h2>
                <div class="underline"></div>
            </div>
            <!-- review -->
            <article class="review">
                <div class="img-container">
                    <img src="./images/person-3.jpg" id="person-img" alt="">
                </div>
                <h4 id="author">Sam Smith</h4>
                <p id="job">UX Designer</p>
                <p id="info">
                    Picks up pet hair and crumbs well on hard floors, and switching to the handheld mode takes seconds.
                    Battery life drops to about 15 minutes on max suction, so it is best for quick daily cleanups rather
                    than a full house.
                </p>
                <!-- prev next buttons -->
                 <div class="button-container">
                    <button class="prev-btn">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <button class="next-btn">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                 </div>
                 <!-- random button -->
                  <button class="random-btn"> Suprise me</button>

            </article>
        </section>

    </main>


    <!-- JavaScript -->
    <script src="app.js"></script>

</body>

</html>
